# =============================================================================
# ImperialSeal — Nginx Reverse Proxy Configuration
#
# Proxies:
#   /api/*        → Express backend   (localhost:3001)
#   /             → Next.js frontend  (localhost:3000)
#
# Setup:
#   1. Replace __DOMAIN__ with your domain (done automatically by setup-azure.sh
#      and migrate.sh via sed substitution).
#   2. Copy to /etc/nginx/sites-available/imperialseal
#   3. ln -sf /etc/nginx/sites-available/imperialseal \
#             /etc/nginx/sites-enabled/imperialseal
#   4. nginx -t && systemctl reload nginx
#   5. Run certbot — it will append the SSL server block automatically.
#
# After certbot runs this file will be modified in-place to add the
# ssl_certificate directives and HTTPS server block. Do not manually
# edit the SSL section; let certbot manage it.
# =============================================================================

# ─── Rate limiting zones (defined in http context via /etc/nginx/nginx.conf
#     snippets, but declared here for self-contained deployments) ───────────
# Uncomment if this file is included directly in nginx.conf http block:
# limit_req_zone  $binary_remote_addr zone=api_limit:10m   rate=30r/m;
# limit_req_zone  $binary_remote_addr zone=auth_limit:10m  rate=10r/m;
# limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ─── Upstream definitions ────────────────────────────────────────────────────
upstream imperialseal_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream imperialseal_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ─── HTTP → HTTPS redirect (certbot will manage this block) ──────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name __DOMAIN__;

    # Allow Let's Encrypt ACME challenge through
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS main server block ─────────────────────────────────────────────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name __DOMAIN__;

    # ── SSL — certbot will populate these paths ──
    # ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── SSL hardening (applied alongside certbot managed options) ──
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── HSTS — 1 year, include subdomains ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Security headers ──
    add_header X-Frame-Options           "SAMEORIGIN"              always;
    add_header X-Content-Type-Options    "nosniff"                 always;
    add_header X-XSS-Protection          "1; mode=block"           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; "
        "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
        "font-src 'self' https://fonts.gstatic.com; "
        "img-src 'self' data: blob: https:; "
        "connect-src 'self' https://api.coingecko.com https://*.supabase.co wss://*.supabase.co https://node.voi.network https://mainnet-api.algonode.cloud; "
        "frame-ancestors 'none';"
        always;

    # ── Gzip compression ──
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_buffers    16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # ── Request size limits ──
    client_max_body_size    50M;   # Allow CSV uploads and PDF assets
    client_body_buffer_size 128k;

    # ── Timeouts ──
    proxy_connect_timeout   60s;
    proxy_send_timeout      120s;
    proxy_read_timeout      120s;
    send_timeout            120s;

    # ── Proxy headers (shared) ──
    proxy_http_version      1.1;
    proxy_set_header        Upgrade           $http_upgrade;
    proxy_set_header        Connection        "upgrade";
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        X-Forwarded-Host  $host;
    proxy_set_header        X-Forwarded-Port  $server_port;
    proxy_cache_bypass      $http_upgrade;

    # ── Logging ──
    access_log  /var/log/nginx/imperialseal-access.log  combined buffer=512k flush=1m;
    error_log   /var/log/nginx/imperialseal-error.log   warn;

    # =========================================================================
    # /api/* — Express backend (port 3001)
    # =========================================================================
    location /api/ {
        # Strip /api prefix before forwarding to Express
        # Express routes are mounted at /api/* with the prefix kept,
        # so we DO keep the /api prefix. Remove the rewrite if Express
        # strips it internally with app.use('/api', router).
        proxy_pass          http://imperialseal_backend;

        # Do NOT buffer large request bodies (file uploads, CSV)
        proxy_request_buffering off;

        # Rate limiting — uncomment once zones are declared in http block
        # limit_req zone=api_limit  burst=60  nodelay;
        # limit_conn conn_limit 20;

        # Auth endpoints get stricter rate limiting
        # Handled per-location below — see /api/auth
    }

    # Auth endpoints — tighter rate limit
    location ~* ^/api/(auth|admin/login) {
        proxy_pass          http://imperialseal_backend;
        # limit_req zone=auth_limit burst=5 nodelay;
        proxy_request_buffering off;
    }

    # Blockchain webhook / callback — no size restriction
    location /api/webhooks/ {
        proxy_pass              http://imperialseal_backend;
        proxy_request_buffering off;
        client_max_body_size    10M;
    }

    # Health check endpoint — bypass rate limits, no logging
    location = /api/health {
        proxy_pass          http://imperialseal_backend;
        access_log          off;
        proxy_read_timeout  5s;
    }

    # =========================================================================
    # Next.js static assets — served with aggressive caching
    # =========================================================================

    # Next.js build output (hashed filenames — cache forever)
    location /_next/static/ {
        proxy_pass          http://imperialseal_frontend;
        proxy_cache_valid   200 365d;
        add_header          Cache-Control "public, max-age=31536000, immutable";
        access_log          off;
    }

    # Next.js image optimisation endpoint
    location /_next/image {
        proxy_pass          http://imperialseal_frontend;
        proxy_cache_valid   200 1d;
        add_header          Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
    }

    # Next.js HMR websocket (dev only — harmless in prod)
    location /_next/webpack-hmr {
        proxy_pass          http://imperialseal_frontend;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
    }

    # Public static files (favicon, robots.txt, certificate PDFs served
    # directly via Next.js public/ folder)
    location /static/ {
        proxy_pass          http://imperialseal_frontend;
        add_header          Cache-Control "public, max-age=86400";
        access_log          off;
    }

    location = /favicon.ico {
        proxy_pass          http://imperialseal_frontend;
        add_header          Cache-Control "public, max-age=86400";
        access_log          off;
        log_not_found       off;
    }

    location = /robots.txt {
        proxy_pass          http://imperialseal_frontend;
        add_header          Cache-Control "public, max-age=3600";
        access_log          off;
        log_not_found       off;
    }

    # =========================================================================
    # Everything else — Next.js frontend (port 3000)
    # =========================================================================
    location / {
        proxy_pass          http://imperialseal_frontend;

        # SSE / streaming responses (used by Next.js server actions)
        proxy_buffering     off;
        proxy_cache         off;

        # Short-circuit for Not Modified responses
        proxy_cache_valid   200 0s;
    }

    # ── Custom error pages ──
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
        internal;
    }
}